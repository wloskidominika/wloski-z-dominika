# Netlify: a ogni pubblicazione rigenera le pagine del blog e la sitemap
[build]
  publish = "."
  command = "python3 tools/pull_content.py; python3 tools/build_site.py && python3 tools/build_blog.py"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"


[[headers]]
  for = "/gestione.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# il vecchio pannello (GitHub) non serve più: tutto si fa nell'app
[[redirects]]
  from = "/admin/*"
  to = "/app"
  status = 302
  force = true
