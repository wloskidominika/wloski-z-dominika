# Netlify: a ogni pubblicazione rigenera le pagine del blog e la sitemap
[build]
  publish = "."
  command = "python3 tools/build_site.py && python3 tools/build_blog.py"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# La tua app di gestione: wloskizdominika.com/app
[[redirects]]
  from = "/app"
  to = "/gestione.html"
  status = 200

[[headers]]
  for = "/gestione.html"
  [headers.values]
    X-Robots-Tag = "noindex"
