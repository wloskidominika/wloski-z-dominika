<section class="lessons" id="lessons">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i="les_eyebrow"></div>
      <h2 data-i="les_title"></h2>
      <p data-i="les_sub"></p>
    </div>
    <div class="lang-cards">
      <div class="lcard">
        <div class="flag"><i style="background:#1C8A4E"></i><i style="background:#FFF8EE"></i><i style="background:#CE3A2B"></i></div>
        <h3 data-i="it_title"></h3>
        <p data-i="it_sub"></p>
        <ul id="itList"></ul>
        <a class="btn btn-red" href="#contact" data-course="it" data-i="les_cta"></a>
      </div>
      <div class="lcard">
        <div class="flag" style="flex-direction:column"><i style="background:#fff"></i><i style="background:#DC143C"></i></div>
        <h3 data-i="pl_title"></h3>
        <p data-i="pl_sub"></p>
        <ul id="plList"></ul>
        <a class="btn btn-red" href="#contact" data-course="pl" data-i="les_cta"></a>
      </div>
    </div>
    <div class="formats">
      <div class="format"><b data-i="f1_t"></b><span data-i="f1_d"></span></div>
      <div class="format"><b data-i="f2_t"></b><span data-i="f2_d"></span></div>
      <div class="format"><b data-i="f3_t"></b><span data-i="f3_d"></span></div>
    </div>
    <div class="transl" id="translations">
      <div class="transl-head"><div class="eyebrow" data-i="tl_eyebrow"></div><h3 data-i="tl_title"></h3><p data-i="tl_sub"></p></div>
      <div class="pairs"><span data-i="tl_p1"></span><span data-i="tl_p2"></span><span data-i="tl_p3"></span></div>
      <a class="btn btn-red" href="#contact" data-pick="tr" data-i="tl_cta"></a>
    </div>
  </div>
</section>
