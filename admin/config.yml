# Pannello di amministrazione – Decap CMS
backend:
  name: github
  repo: wloskidominika/wloski-z-dominika
  branch: main
local_backend: true
locale: it
site_url: https://wloskizdominika.com
display_url: https://wloskizdominika.com
logo_url: /logo.jpg
media_folder: media
public_folder: /media
collections:
- name: blog
  label: 📝 Blog
  label_singular: articolo
  folder: content/blog
  create: true
  delete: true
  extension: json
  format: json
  slug: '{{slug}}'
  identifier_field: title
  summary: '{{title}} · {{lang}} · {{date}}{{#draft}} · BOZZA{{/draft}}'
  sortable_fields:
  - date
  - title
  description: 'Scrivi un articolo: a destra il 🔍 Correttore SEO ti dice cosa migliorare. L''indirizzo della pagina nasce dal titolo quando crei l''articolo.'
  editor:
    preview: true
  fields:
  - name: title
    label: Titolo dell'articolo
    widget: string
    hint: Ideale 30–60 caratteri, con la frase chiave all'inizio.
  - name: keyword
    label: Frase chiave (cosa cercano i clienti su Google)
    widget: string
    required: false
    hint: Es. «cosa vedere a Tropea», «Tropea co zobaczyć», «Tropea Sehenswürdigkeiten».
  - name: lang
    label: Lingua dell'articolo
    widget: select
    default: it
    options:
    - label: Italiano
      value: it
    - label: Polski
      value: pl
    - label: Deutsch
      value: de
    - label: English
      value: en
    - label: Español
      value: es
  - name: group
    label: Traduzione di… (collega le versioni in lingue diverse)
    widget: string
    required: false
    hint: 'Scrivi lo stesso codice in tutte le traduzioni dello stesso articolo (es. «cosa-vedere-a-tropea»). Così chi cambia lingua passa alla versione giusta. Per un articolo nuovo puoi lasciarlo vuoto.'
  - name: description
    label: Descrizione per Google
    widget: text
    hint: '1–2 frasi, 120–155 caratteri: è il testo che compare sotto il titolo nei risultati di Google.'
  - name: seo_title
    label: Titolo per Google (facoltativo)
    widget: string
    required: false
    hint: Solo se vuoi un titolo diverso nei risultati di Google.
  - name: date
    label: Data
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    time_format: false
    picker_utc: true
    default: '{{now}}'
    required: false
  - name: category
    label: Categoria
    widget: select
    default: Guide
    options:
    - Guide
    - Escursioni
    - Informazioni pratiche
    - Sapori
    - Lingua italiana
    - Język polski
    - Notizie
  - name: cover
    label: Foto di copertina
    widget: image
    required: false
  - name: cover_alt
    label: Descrizione della foto (testo alternativo)
    widget: string
    required: false
    hint: Cosa si vede nella foto, in poche parole.
  - name: body
    label: Testo dell'articolo
    widget: markdown
    hint: 'Per i sottotitoli usa il pulsante «H» (Titolo 2). Aggiungi link alle tue pagine con il pulsante 🔗: /escursioni.html, /case-vacanze.html, /transfer.html, /noleggio.html.'
  - name: draft
    label: Bozza (non pubblicare ancora)
    widget: boolean
    default: false
    required: false
