<p>Transfers to providers outside the EU rely on the EU-US Data Privacy Framework and/or the European Commission's Standard Contractual Clauses.</p>
<p>If you pay online, payment takes place on the secure page of <b>Stripe</b> or <b>PayPal</b>, which act as independent controllers under their own privacy notices. We never see or store your card details.</p>
<p>If you write to us on <b>WhatsApp</b>, open our <b>Facebook</b> page or watch a <b>YouTube</b> video, those services process data under their own notices. The site only contains links: no “Like” button or plugin sends data to Facebook.</p>
<p>Data may be shared with our accountant for tax purposes, with property owners or providers of the services you book (only what is needed), and with authorities when required by law.</p>

<h2 id="diritti">6. Your rights</h2>
<p>At any time you can ask to access, correct or delete your data, restrict its use, receive it in a portable format, object to processing based on legitimate interest and withdraw your consent, without affecting earlier processing (Arts. 15–22 GDPR). Write to {email}: we reply within 30 days.</p>
<p>You can also lodge a complaint with the Italian <b>Garante per la protezione dei dati personali</b> (www.garanteprivacy.it) or with the authority of the country where you live.</p>
<p>You can change your name, phone and language yourself in the <i>Profile</i> section of the members' area.</p>

<h2>7. Minors</h2>
<p>You must be at least 14 to sign up. For children under 14, sign-up and bookings must be made by a parent or guardian.</p>

<h2>8. Required data</h2>
<p>To answer an enquiry we need your name and an email or phone number; to create an account, name and email. Without them we cannot provide the service. Everything else is optional.</p>

<h2>9. Security</h2>
<p>The site uses an encrypted connection (HTTPS). Passwords are stored only in encrypted form, personal documents open only through temporary links, and only the owner can access the data.</p>

<h2 id="cookie">10. Cookie policy</h2>
<p>This site uses <b>no profiling, advertising or third-party analytics cookies</b> (no Google Analytics, no Facebook Pixel).</p>
<p>It only uses strictly necessary technical storage in your browser. Under Italian law (Art. 122 Privacy Code and the Garante's guidelines of 10 June 2021) these <b>do not require consent</b>, which is why you don't see a cookie banner.</p>
<table>
<tr><th>Name</th><th>Type</th><th>Purpose</th><th>Duration</th></tr>
<tr><td>wzd-lang</td><td>local storage</td><td>Remembers the language you chose</td><td>Until you clear it in your browser</td></tr>
<tr><td>wzd-sid</td><td>session storage</td><td>Random number so a visit is counted only once (anonymous)</td><td>Deleted when you close the tab</td></tr>
<tr><td>wzd</td><td>technical cookie</td><td>Keeps you logged in to the members' area (only if you log in)</td><td>Until you log out or close the browser</td></tr>
</table>
<p><b>YouTube videos:</b> embedded in “privacy-enhanced mode” (youtube-nocookie.com) and loaded only when you press play. From then on YouTube (Google) may store its own data: see Google's privacy policy.</p>
<p><b>Fonts:</b> hosted on our own server, so no data is sent to Google Fonts.</p>
<p>You can delete this data at any time in your browser settings.</p>

<p>Nie wykorzystujemy Twoich danych do reklamy, profilowania ani newsletterów i nikomu ich nie sprzedajemy.</p>

<h2>4. Jak długo przechowujemy dane</h2>

<h2>5. Kto ma dostęp do danych</h2>

<ul>
<li><b>Aruba S.p.A.</b> (Włochy) – hosting, przechowywanie danych, strefa klienta i wysyłka e-maili. Serwery we Włoszech.</li>
<li><b>Google Ireland Ltd.</b> (Gmail) – skrzynka, na którą właścicielka otrzymuje powiadomienia o nowych zapytaniach i opiniach.</li>
<li><b>Kloudend Inc.</b> (ipapi.co, USA) – aby oszacować kraj i miasto odwiedzin, Twój adres IP jest na chwilę przesyłany do tej usługi; <b>adres IP nie jest zapisywany</b>.</li>
</ul>
<p>Przekazywanie danych poza UE odbywa się na podstawie EU-US Data Privacy Framework i/lub standardowych klauzul umownych Komisji Europejskiej.</p>
<p>Płatności online odbywają się na bezpiecznej stronie <b>Stripe</b> lub <b>PayPal</b>, które działają jako odrębni administratorzy zgodnie z własnymi politykami. Nie widzimy i nie przechowujemy danych Twojej karty.</p>
<p>Jeśli napiszesz do nas na <b>WhatsApp</b>, otworzysz naszą stronę na <b>Facebooku</b> lub obejrzysz film na <b>YouTube</b>, te serwisy przetwarzają dane według własnych zasad. Na stronie są tylko linki: żaden przycisk „Lubię to” ani wtyczka nie wysyła danych do Facebooka.</p>
<p>Dane mogą być przekazane księgowej w celach podatkowych, właścicielom noclegów lub dostawcom rezerwowanych usług (tylko w niezbędnym zakresie) oraz organom, gdy wymaga tego prawo.</p>

<h2 id="diritti">6. Twoje prawa</h2>
<p>W każdej chwili możesz żądać dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, przeniesienia, wnieść sprzeciw wobec przetwarzania opartego na uzasadnionym interesie i wycofać zgodę, bez wpływu na wcześniejsze przetwarzanie (art. 15–22 RODO). Napisz na {email}: odpowiemy w ciągu 30 dni.</p>
<p>Możesz też złożyć skargę do włoskiego <b>Garante per la protezione dei dati personali</b> (www.garanteprivacy.it) lub do organu w swoim kraju (w Polsce: Prezes UODO, uodo.gov.pl).</p>
<p>Imię, telefon i język możesz zmienić samodzielnie w sekcji <i>Profil</i> strefy klienta.</p>

<h2>7. Osoby niepełnoletnie</h2>

<h2>8. Dane obowiązkowe</h2>
<p>Aby odpowiedzieć na zapytanie, potrzebujemy imienia oraz e-maila lub telefonu; do założenia konta – imienia i e-maila. Bez nich nie możemy zrealizować usługi. Pozostałe dane są dobrowolne.</p>

<h2>9. Bezpieczeństwo</h2>

<h2 id="cookie">10. Polityka cookies</h2>

<p>Korzysta tylko z niezbędnych technicznych danych zapisywanych w przeglądarce. Zgodnie z prawem włoskim (art. 122 Kodeksu prywatności i wytyczne Garante z 10 czerwca 2021) <b>nie wymagają one zgody</b>, dlatego nie widzisz banera cookies.</p>

<tr><td>wzd-lang</td><td>local storage</td><td>Zapamiętuje wybrany język</td><td>Dopóki go nie usuniesz w przeglądarce</td></tr>

<tr><td>wzd</td><td>techniczny plik cookie</td><td>Utrzymuje zalogowanie w strefie klienta (tylko po zalogowaniu)</td><td>Do wylogowania lub zamknięcia przeglądarki</td></tr>

<p><b>Filmy YouTube:</b> osadzone w „trybie rozszerzonej prywatności” (youtube-nocookie.com) i ładowane dopiero po naciśnięciu play. Od tego momentu YouTube (Google) może zapisywać własne dane: zobacz politykę prywatności Google.</p>
<p><b>Czcionki:</b> są przechowywane na naszym serwerze, więc żadne dane nie trafiają do Google Fonts.</p>
<p>Możesz w każdej chwili usunąć te dane w ustawieniach przeglądarki.</p>

<h1>Privacidad, cookies y RGPD</h1>
<p class="muted">Información según los arts. 13–14 del Reglamento (UE) 2016/679 (RGPD) · Última actualización: {updated}</p>
<div class="toc"><a href="#privacy">Política de privacidad</a> · <a href="#diritti">Tus derechos</a> · <a href="#cookie">Política de cookies</a></div>

<h2 id="privacy">1. Responsable del tratamiento</h2>
<p>{owner}, titular de la actividad <b>Włoski z Dominiką i Podróże do Kalabrii</b>, NIF-IVA (P.IVA) {vat}{sede}.<br>Contacto para privacidad: {email}</p>

<h2>2. Qué datos tratamos</h2>
<ul>
<li><b>Solicitudes de información</b> (formulario «Escríbeme» y botones «Solicitar información»): nombre, e-mail y/o teléfono, idioma elegido, servicio o alojamiento que te interesa, fechas, número de personas y tu mensaje.</li>
<li><b>Opiniones:</b> nombre, país, valoración, texto y e-mail. En la web publicamos, tras revisarlos, solo nombre, país, valoración y texto; el e-mail nunca se publica.</li>
<li><b>Registro en el área privada:</b> nombre y apellidos, e-mail, teléfono (opcional), idioma preferido, contraseña (guardada solo cifrada).</li>
<li><b>Reservas:</b> tipo de servicio, fechas, número de personas, tus notas, estado de la reserva y del pago, mensajes de la titular, documentos que te afectan (p. ej. contratos).</li>
<li><b>Cursos de idiomas:</b> cursos en los que estás inscrito/a y acceso a los materiales.</li>
<li><b>Estadísticas anónimas de visitas:</b> página vista, tiempo de permanencia, idioma, país y ciudad aproximados, tipo de dispositivo y sitio de procedencia. No usamos cookies para ello ni guardamos la dirección IP: estos datos no permiten identificarte.</li>
<li><b>Datos técnicos:</b> dirección IP y datos del navegador registrados automáticamente por el servidor por seguridad y funcionamiento.</li>
</ul>
<p>No pedimos datos especiales (p. ej. de salud). Si en las notas indicas alergias o necesidades alimentarias, las usaremos solo para organizar el servicio.</p>

<h2>3. Finalidades y bases jurídicas</h2>
<table>
<tr><th>Finalidad</th><th>Base jurídica</th></tr>
<tr><td>Responder a tus solicitudes y preparar un presupuesto</td><td>Medidas precontractuales a petición tuya (art. 6.1.b RGPD)</td></tr>
<tr><td>Gestionar tu cuenta y reservas, prestar clases, excursiones y servicios, acceso a materiales</td><td>Ejecución de un contrato (art. 6.1.b)</td></tr>
<tr><td>Publicar tu opinión</td><td>Tu consentimiento, que puedes retirar cuando quieras (art. 6.1.a)</td></tr>
<tr><td>Pagos online y posibles reembolsos</td><td>Ejecución de un contrato (art. 6.1.b)</td></tr>
<tr><td>Obligaciones fiscales y contables y obligaciones de los alojamientos turísticos</td><td>Obligación legal (art. 6.1.c)</td></tr>
<tr><td>Seguridad del sitio, prevención de abusos, estadísticas anónimas para mejorarlo</td><td>Interés legítimo (art. 6.1.f)</td></tr>
</table>
<p>No usamos tus datos para publicidad, perfiles ni boletines, y no los vendemos a nadie.</p>

<h2>4. Cuánto tiempo los conservamos</h2>
<ul>
<li>Solicitudes: hasta 24 meses desde el último contacto, si no se convierten en reserva.</li>
<li>Cuenta y reservas: mientras la cuenta esté activa. Puedes pedir su eliminación en cualquier momento.</li>
<li>Opiniones: mientras estén publicadas o hasta que pidas retirarlas.</li>
<li>Datos necesarios para facturas y contabilidad: 10 años, según la ley.</li>
<li>Datos técnicos del servidor: según el proveedor, normalmente pocos días o semanas.</li>
</ul>

<h2>5. Quién puede ver los datos</h2>
<p>Los datos los trata solo la titular. Para que el sitio funcione usamos proveedores que actúan como encargados del tratamiento:</p>
<ul>
<li><b>Aruba S.p.A.</b> (Italia) – alojamiento web, almacenamiento de datos, área privada y envío de e-mails. Servidores en Italia.</li>
<li><b>Google Ireland Ltd.</b> (Gmail) – buzón donde la titular recibe el aviso de nuevas solicitudes y opiniones.</li>
<li><b>Kloudend Inc.</b> (ipapi.co, EE. UU.) – para estimar el país y la ciudad de la visita, tu dirección IP se envía un instante a este servicio; <b>la dirección IP no se guarda</b>.</li>
</ul>
<p>Las transferencias fuera de la UE se basan en el EU-US Data Privacy Framework y/o en las Cláusulas Contractuales Tipo de la Comisión Europea.</p>
<p>Si pagas online, el pago se hace en la página segura de <b>Stripe</b> o <b>PayPal</b>, que actúan como responsables independientes según sus propias políticas. Nunca vemos ni guardamos los datos de tu tarjeta.</p>
<p>Si nos escribes por <b>WhatsApp</b>, abres nuestra página de <b>Facebook</b> o ves un vídeo de <b>YouTube</b>, esos servicios tratan los datos según sus propias políticas. En la web solo hay enlaces: ningún botón «Me gusta» ni plugin envía datos a Facebook.</p>
<p>Los datos pueden comunicarse al gestor fiscal, a los propietarios de los alojamientos o proveedores de los servicios que reserves (solo lo necesario) y a las autoridades cuando la ley lo exija.</p>

<h2 id="diritti">6. Tus derechos</h2>
<p>Puedes pedir en cualquier momento el acceso a tus datos, su rectificación, supresión, limitación, portabilidad, oponerte al tratamiento basado en interés legítimo y retirar tu consentimiento, sin afectar a lo hecho antes (arts. 15–22 RGPD). Escribe a {email}: respondemos en 30 días.</p>
<p>También puedes reclamar ante el <b>Garante per la protezione dei dati personali</b> italiano (www.garanteprivacy.it) o ante la autoridad de tu país (en España: AEPD, aepd.es).</p>
<p>Puedes cambiar tú mismo/a el nombre, el teléfono y el idioma en la sección <i>Perfil</i> del área privada.</p>

<h2>7. Menores</h2>
<p>Para registrarse hay que tener al menos 14 años. Para menores de 14 años, el registro y las reservas los hace un padre, una madre o un tutor.</p>

<h2>8. Datos obligatorios</h2>
<p>Para responder a una solicitud necesitamos tu nombre y un e-mail o teléfono; para crear una cuenta, nombre y e-mail. Sin ellos no podemos prestar el servicio. El resto es opcional.</p>

<h2>9. Seguridad</h2>
<p>El sitio usa conexión cifrada (HTTPS). Las contraseñas se guardan solo cifradas, los documentos personales se abren solo con enlaces temporales y solo la titular tiene acceso a los datos.</p>

<h2 id="cookie">10. Política de cookies</h2>
<p>Este sitio <b>no usa cookies de perfiles, publicitarias ni de analítica de terceros</b> (ni Google Analytics, ni Píxel de Facebook).</p>
<p>Solo usa almacenamiento técnico necesario en tu navegador. Según la ley italiana (art. 122 del Código de Privacidad y directrices del Garante de 10 de junio de 2021) <b>no requiere consentimiento</b>, por eso no ves un banner de cookies.</p>
<table>
<tr><th>Nombre</th><th>Tipo</th><th>Para qué sirve</th><th>Duración</th></tr>
<tr><td>wzd-lang</td><td>local storage</td><td>Recuerda el idioma que elegiste</td><td>Hasta que lo borres del navegador</td></tr>
<tr><td>wzd-sid</td><td>session storage</td><td>Número aleatorio para contar una visita una sola vez (anónimo)</td><td>Se borra al cerrar la pestaña</td></tr>
<tr><td>wzd</td><td>cookie técnica</td><td>Mantiene tu sesión en el área privada (solo si entras)</td><td>Hasta que salgas o cierres el navegador</td></tr>
</table>
<p><b>Vídeos de YouTube:</b> insertados en «modo de privacidad mejorada» (youtube-nocookie.com) y cargados solo cuando pulsas play. Desde entonces YouTube (Google) puede guardar sus propios datos: consulta la política de Google.</p>
<p><b>Tipografías:</b> alojadas en nuestro servidor, así que no se envían datos a Google Fonts.</p>
<p>Puedes borrar estos datos en cualquier momento desde los ajustes de tu navegador.</p>
